<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doorsturen...</title>
<script>
// GitHub Pages toont deze pagina voor elk adres dat niet bestaat, zoals .../pws-quiz/ABC1234.
// Het laatste stukje van het adres is de code: stuur door naar index.html?c=CODE (met de bedrijfsnaam erbij).
(function(){
  var parts = location.pathname.split("/").filter(Boolean);
  var code = parts.pop() || "";
  var base = "/" + parts.join("/") + (parts.length ? "/" : "");
  var extra = location.search ? "&" + location.search.slice(1) : "";
  location.replace(base + "?c=" + encodeURIComponent(code) + extra);
})();
</script>
</head>
<body style="background:#050d05;color:#33ff33;font-family:monospace">Doorsturen naar je verhaal...</body>
</html>
